[package]
name = "open-ot-definition"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Experimental OpenOT definition-file model, canonicalization, and hash binding"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/johannesPettersson80/open-ot-experiments"
keywords = ["plc", "logging", "industrial", "canonical-json", "telemetry"]
categories = ["encoding", "data-structures"]

[dependencies]
open-ot-carriage = { path = "../carriage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
